name: Prepare and Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore Android project
        run: |
          set -e
          base64 --decode VamsiCricketWidget-redesign.zip.b64 > VamsiCricketWidget-redesign.zip
          unzip -oq VamsiCricketWidget-redesign.zip
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VamsiCricketWidget-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
